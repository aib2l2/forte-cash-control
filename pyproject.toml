[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forte-cash-control"
version = "1.0.1"
description = "ForteAI Cash Control: локальная видеоаналитика на R3D-18"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.37,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
ml = [
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "scikit-learn>=1.5,<2",
    "opencv-python-headless>=4.10,<5",
]

[tool.setuptools.packages.find]
include = ["backend*", "cash_ml*"]

[tool.setuptools.package-data]
cash_ml = ["rule_registry.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
